name: Build APK

on:
  push:
    branches: [mt-live]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MT-LIVE.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MT-LIVE-apk
          path: MT-LIVE.apk
          if-no-files-found: error

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mt-live-latest
          name: MT LIVE — أحدث نسخة
          body: نسخة MT LIVE. نزّل الملف MT-LIVE.apk ونصّبه.
          files: MT-LIVE.apk
