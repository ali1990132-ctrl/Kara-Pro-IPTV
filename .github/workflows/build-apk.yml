name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk A-S.apk

      - name: Generate version.json
        run: |
          VC=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)
          VN=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          echo "{\"versionCode\": ${VC}, \"versionName\": \"${VN}\", \"url\": \"https://github.com/ali1990132-ctrl/Kara-Pro-IPTV/releases/download/latest/A-S.apk\"}" > version.json
          cat version.json

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: A-S-debug-apk
          path: A-S.apk
          if-no-files-found: error

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: A&S — أحدث نسخة
          body: نسخة A&S. نزّل الملف A-S.apk ونصّبه على التلفون.
          files: |
            A-S.apk
            version.json
