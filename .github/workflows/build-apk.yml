name: Build APK

on:
  push:
    branches: [mt-live]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK + version file
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk A-S-4K.apk
          # نفس التطبيق بمكان رابط MT القديم
          cp A-S-4K.apk MT-LIVE.apk
          cp A-S-4K.apk "A&S_4K.apk"
          VC=$((100 + GITHUB_RUN_NUMBER))
          NOTES=$(git log -1 --pretty=%s | sed 's/"/\\"/g')
          printf '{"versionCode": %d, "versionName": "4.%d", "url": "https://github.com/%s/releases/download/mt-live-latest/A-S-4K.apk", "notes": "%s"}\n' "$VC" "$GITHUB_RUN_NUMBER" "$GITHUB_REPOSITORY" "$NOTES" > version.json
          cat version.json

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: A-S-4K-apk
          path: A-S-4K.apk
          if-no-files-found: error

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mt-live-latest
          name: A&S 4K — أحدث نسخة
          body: نسخة A&S 4K. نزّل الملف A-S-4K.apk ونصّبه — والتحديثات الجاية تنزل من داخل التطبيق.
          files: |
            A-S-4K.apk
            MT-LIVE.apk
            A&S_4K.apk
            version.json
