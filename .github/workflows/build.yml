name: Build A&S Shorts APK (as-shorts)

on:
  push:
    branches: [ as-shorts ]
    paths-ignore:
      - 'content/**'
      - '**.md'
      - 'editor.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/A-S-Shorts.apk

      - uses: actions/upload-artifact@v4
        with:
          name: A-S-Shorts
          path: out/A-S-Shorts.apk

      - name: Publish to Releases (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: as-shorts-latest
          target_commitish: ${{ github.sha }}
          name: A&S Shorts (آخر إصدار)
          body: "نسخة رقم ${{ github.run_number }} — نزّل ملف A-S-Shorts.apk"
          files: out/A-S-Shorts.apk
          make_latest: false
